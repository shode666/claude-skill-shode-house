# .pre-commit-config.yaml — shode-house (v3.7+: NO Python, stock hooks only)
# Install: brew install pre-commit && pre-commit install
#
# Local commits run only off-the-shelf hygiene hooks below — no custom script
# executes on your machine. The full invariant + lint gate lives in
# .github/workflows/ci.yml (inline bash + jq). `make validate` extracts and runs
# that exact script locally — same source of truth, no duplicated logic.
# (v3.12.1: ก่อนหน้านี้ไฟล์นี้อ้าง `make validate` ทั้งที่ Makefile ไม่มี target นั้น)

repos:
  # Built-in basic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml              # YAML syntax (catches argument-hint bugs)
        args: [--unsafe]            # allow custom YAML tags in SKILL.md
      - id: check-json              # JSON syntax (plugin.json + marketplace.json)
      - id: end-of-file-fixer       # newline at EOF
      - id: trailing-whitespace     # trailing space
      - id: mixed-line-ending       # CRLF/LF consistency
      - id: check-merge-conflict    # leftover <<<< markers

  # Secret scanning (Cowork plugin shouldn't ship secrets)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # YAML lint (stricter than check-yaml)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, "{extends: relaxed, rules: {line-length: {max: 200}}}"]
