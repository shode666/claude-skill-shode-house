# Router routing eval fixtures (4.0.1: the 6 agent types; a domain is `plan:<domain>` = a `plan` spawn with references/domain/<domain>.md).
# Each case: a request + the type that should OWN it (primary) and expected T-shirt. No case was dropped in the 18 -> 6 consolidation.
# Cross-domain coverage so a single-agent bias is detectable.
version: 1
kind: routing
cases:
  - id: route-ledger
    request: "ออกแบบ double-entry ledger สำหรับ e-wallet รองรับ PromptPay"
    expect_primary: plan:fintech
    expect_secondary: [plan]
    tshirt: L
  - id: route-matching-engine
    request: "ออกแบบ matching engine crypto exchange รับ limit/market/stop"
    expect_primary: plan:trading
    expect_secondary: [plan, secure]
    tshirt: L
  - id: route-policy-admin
    request: "ออกแบบ policy admin รถยนต์ รองรับ endorsement + renewal"
    expect_primary: plan:insurance
    expect_secondary: [plan]
    tshirt: M
  - id: route-checkout
    request: "ออกแบบ flow checkout ใหม่ให้กดง่ายขึ้น"
    expect_primary: design
    expect_secondary: [plan:ecommerce]
    tshirt: M
  - id: route-docker-ci
    request: "setup FastAPI ใหม่พร้อม Docker + CI"
    expect_primary: operate
    expect_secondary: []
    tshirt: S
  - id: route-unit-test
    request: "review payment service + เขียน unit test ให้"
    expect_primary: verify
    expect_secondary: [verify]
    tshirt: M
  - id: route-business-rule-before-build
    request: "เปลี่ยนสูตรค่าธรรมเนียมโอนเงินเป็น 0.5% ขั้นต่ำ 10 สูงสุด 50 แล้ว implement ให้เลย"
    expect_primary: plan:fintech
    expect_secondary: [build]
    order: [plan:fintech, build]   # the domain-loaded plan spawn returns before any implementer
    tshirt: M
  - id: route-retired-agent-id
    request: "ช่วยเรียก agent developer ให้เพิ่มฟังก์ชัน retry ใน src/notification.py"
    expect_primary: build
    expect_secondary: []
    note: "answered from ownership.md section Formerly; the old id is never spawned"
    tshirt: S
  - id: route-review-axes
    request: "review การเปลี่ยนแปลงล่าสุด ทั้ง code quality และตรงตาม spec ที่ขอไหม"
    expect_primary: verify
    expect_secondary: [plan]
    note: "standards (verify) and spec (plan) are separate spawns; runtime is a third spawn only when the diff crosses a boundary"
    tshirt: M
